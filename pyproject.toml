[project]
name = "iara"
version = "0.1.0"
description = "IA atendente para loja física: vê, ouve e responde por voz"
readme = "README.md"
authors = [
    { name = "Caio Marquez", email = "caio.matheus.marquez@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
iara = "iara.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: precisa de serviços externos (ex.: servidor RTSP local)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
